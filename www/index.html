<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1747c9">
<title>Leitor de Cartas MTG</title>
<style>
/* Layout: faixa azul no topo, câmera grande, controles compactos, lista em branco, barra azul de exportação no rodapé.
   Proporção: branco domina (fundo e lista), azul estrutura (topo, rodapé, botões), amarelo só destaca (faixa do nome, quantidades, botão principal). */
:root{
  --white:#ffffff; --paper:#f3f6fc; --line:#dde4f2;
  --blue:#1747c9; --blue-deep:#0e2f8a; --blue-soft:#e6edfc;
  --yellow:#ffc928; --yellow-soft:#fff4cc;
  --ink:#14213d; --muted:#5d6b88; --ok:#1f9d55; --warn:#d64545;
  --body:Roboto,"Segoe UI",system-ui,sans-serif; --mono:"Roboto Mono","Droid Sans Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--white);color:var(--ink);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

header{background:var(--blue);color:var(--white);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px}
h1{font:700 19px var(--body);letter-spacing:.01em;margin:0;display:flex;align-items:center;gap:8px}
h1 i{display:inline-block;width:12px;height:16px;border-radius:3px;background:var(--yellow)}
.tot{display:flex;gap:6px}
.tot span{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px}
.tot b{color:var(--yellow);font-weight:600}

.stage{background:var(--blue);padding-bottom:14px}
.cam{position:relative;height:52vh;max-height:560px;min-height:300px;background:var(--blue-deep);border-radius:16px;overflow:hidden;touch-action:manipulation}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 9999px rgba(14,47,138,.42);pointer-events:none}
.strip{position:absolute;border:3px solid var(--yellow);border-radius:6px;transition:background .15s,border-color .15s}
.strip::after{content:"NOME";position:absolute;left:-3px;bottom:100%;margin-bottom:4px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink);background:var(--yellow);border-radius:4px;padding:2px 6px}
.strip.hit{background:rgba(31,157,85,.35);border-color:#3ddc84}
.read{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;background:var(--white);border-radius:12px;padding:10px 12px;box-shadow:0 4px 14px rgba(14,47,138,.25)}
.read b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}

.bar{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px 4px}
button{font:600 14px var(--body);color:var(--blue);background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button:active{transform:scale(.97)}
button.on{background:var(--yellow-soft);border-color:var(--yellow);color:var(--ink)}
.bar .grow{flex:1}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);min-height:38px;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px}

.listhead{display:flex;justify-content:space-between;align-items:baseline;padding-block:6px}
.listhead h2{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0}
.listhead span{font-size:12px;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;background:var(--white);border:1.5px solid var(--line);border-radius:12px}
li.new{animation:flash 1.2s}
@keyframes flash{from{background:var(--yellow-soft);border-color:var(--yellow)}}
.qty{font:600 16px var(--mono);font-variant-numeric:tabular-nums;min-width:2.4em;text-align:center;background:var(--yellow);color:var(--ink);border-radius:8px;padding:5px 4px;flex:none}
li input{flex:1;min-width:0;font:500 15px var(--body);color:var(--ink);background:transparent;border:1.5px solid transparent;border-radius:8px;padding:6px}
li input:focus{border-color:var(--blue);background:var(--paper);outline:none}
li button{min-height:38px;min-width:38px;padding:0 10px;font-size:18px;line-height:1;border-color:transparent;background:var(--blue-soft)}
.empty{color:var(--muted);padding:22px 12px;text-align:center;background:var(--paper);border-radius:12px}

.out{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;background:var(--blue);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.out button{flex:1;padding-inline:4px;background:rgba(255,255,255,.12);color:var(--white);border-color:rgba(255,255,255,.25)}
.out button.pri{background:var(--yellow);color:var(--ink);border-color:var(--yellow);flex:1.3}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:9px 14px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:5}
.toast.show{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;z-index:10}
.sheet>div{width:100%;background:var(--white);border-radius:18px 18px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet p{margin:0;font-weight:600;font-size:16px}
.sheet .row{display:flex;gap:8px}
.sheet .row button{flex:1}
.sheet .danger{background:var(--warn);border-color:var(--warn);color:var(--white)}
textarea{position:fixed;left:-9999px;top:0}
</style>
</head>
<body>
<header class="wrap">
  <h1><i aria-hidden="true"></i>Leitor de Cartas</h1>
  <div class="tot"><span><b id="totCards">0</b> cartas</span><span><b id="totNames">0</b> nomes</span></div>
</header>

<div class="stage wrap">
  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame" id="frame"><div class="strip" id="strip"></div></div>
    <div class="read"><span class="dot" id="dot"></span><b id="readTxt">Abrindo a câmera…</b></div>
  </div>
</div>

<div class="wrap">
  <div class="bar">
    <div class="seg" role="group" aria-label="Modo de leitura">
      <button id="mCont" aria-pressed="true">Contínuo</button>
      <button id="mTap" aria-pressed="false">Toque</button>
    </div>
    <button id="pauseBtn">Pausar</button>
    <button id="torchBtn" hidden>Lanterna</button>
    <button id="plusBtn" class="grow">+1 na última</button>
    <button id="undoBtn">Desfazer</button>
  </div>
  <p class="hint" id="hint">Contínuo: troque a carta e ele lê sozinho. Para cartas iguais seguidas, basta trocar uma pela outra.</p>

  <div class="listhead"><h2>Lista</h2><span>toque no nome para corrigir</span></div>
  <ol id="list"></ol>
</div>

<div class="out wrap">
  <button class="pri" id="copyBtn">Copiar lista</button>
  <button id="txtBtn">Salvar .txt</button>
  <button id="shareBtn" hidden>Enviar</button>
  <button id="clearBtn">Limpar</button>
</div>

<div class="sheet" id="confirmBox" hidden>
  <div class="wrap">
    <p>Apagar a lista inteira?</p>
    <div class="row"><button id="noClear">Cancelar</button><button id="yesClear" class="danger">Apagar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<textarea id="clip" aria-hidden="true" tabindex="-1"></textarea>

<script>
(() => {
const $ = id => document.getElementById(id);
const video=$('video'), cam=$('cam'), frame=$('frame'), strip=$('strip');
const CARD = 63/88;               // proporção da carta
const NAME = {x:.05, y:.032, w:.68, h:.072}; // faixa do nome (sem o custo de mana)

let entries = [];   // {name, count}
let history = [];   // índices adicionados, para desfazer
let stream=null, track=null, torch=false;
let gen=0;
let running=false, paused=false, mode='cont', busy=false;
let armed=true, lastKey='', prevKey='', lastAddAt=0, motionPrev=null;

/* ---------- persistência ---------- */
try{ const s=JSON.parse(localStorage.getItem('mtg-lista')||'null'); if(s&&Array.isArray(s.entries)) entries=s.entries; }catch(e){}
const save=()=>{ try{ localStorage.setItem('mtg-lista',JSON.stringify({entries})); }catch(e){} };

/* ---------- texto ---------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function clean(raw){
  let t = (raw||'').replace(/[\r\n]+/g,' ')
    .replace(/[^A-Za-zÀ-ÿ0-9' ,\-]/g,' ').replace(/\s+/g,' ').trim();
  // remove lixo isolado nas pontas (símbolos de mana lidos como letras soltas)
  t = t.replace(/^([B-DF-NP-Zb-df-np-z0-9] )+/,'').replace(/( [A-Za-z0-9])+$/,'').trim();
  return t;
}
function sim(a,b){
  if(!a||!b) return 0; if(a===b) return 1;
  const m=a.length,n=b.length; let p=Array(n+1).fill(0).map((_,j)=>j);
  for(let i=1;i<=m;i++){ let c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return 1-p[n]/Math.max(m,n);
}

/* ---------- lista ---------- */
function add(name){
  const k=norm(name); let idx=entries.findIndex(e=>sim(norm(e.name),k)>=.82);
  if(idx<0){ entries.push({name,count:1}); idx=entries.length-1; } else entries[idx].count++;
  history.push(idx); save(); render(idx); feedback();
}
function render(hl=-1){
  const ol=$('list'); ol.textContent='';
  if(!entries.length){ const d=document.createElement('div'); d.className='empty'; d.textContent='Nenhuma carta lida ainda. Encaixe uma carta na moldura.'; ol.append(d); }
  entries.forEach((e,i)=>{
    const li=document.createElement('li'); if(i===hl) li.className='new';
    const q=document.createElement('span'); q.className='qty'; q.textContent=e.count;
    const inp=document.createElement('input'); inp.id='n'+i; inp.value=e.name; inp.setAttribute('aria-label','Nome da carta');
    inp.onchange=()=>{ e.name=inp.value.trim()||e.name; save(); };
    const mi=document.createElement('button'); mi.textContent='−'; mi.setAttribute('aria-label','Diminuir');
    mi.onclick=()=>{ e.count--; if(e.count<=0) entries.splice(i,1); history=[]; save(); render(); };
    const pl=document.createElement('button'); pl.textContent='+'; pl.setAttribute('aria-label','Aumentar');
    pl.onclick=()=>{ e.count++; save(); render(i); };
    li.append(q,inp,mi,pl); ol.append(li);
  });
  const total=entries.reduce((s,e)=>s+e.count,0);
  $('totCards').textContent=total; $('totNames').textContent=entries.length;
  if(hl>=0) ol.children[hl]?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
const listText=()=>entries.map(e=>`${e.count} ${e.name}`).join('\n');

/* ---------- feedback ---------- */
let actx=null;
function feedback(){
  strip.classList.add('hit'); setTimeout(()=>strip.classList.remove('hit'),350);
  try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){}
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=1250; g.gain.value=.08;
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.07); }catch(e){}
}
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- moldura ---------- */
function layout(){
  const W=cam.clientWidth,H=cam.clientHeight-62; // deixa espaço para a leitura
  let h=H*.94, w=h*CARD; if(w>W*.92){ w=W*.92; h=w/CARD; }
  Object.assign(frame.style,{width:w+'px',height:h+'px',left:(W-w)/2+'px',top:Math.max(8,(H-h)/2)+'px'});
  Object.assign(strip.style,{left:NAME.x*100+'%',width:NAME.w*100+'%',right:'auto',top:NAME.y*100+'%',height:NAME.h*100+'%'});
}
addEventListener('resize',layout);

// converte um retângulo da tela (CSS) para pixels do vídeo, considerando object-fit:cover
function toVideo(r){
  const vw=video.videoWidth,vh=video.videoHeight,cw=cam.clientWidth,ch=cam.clientHeight;
  const s=Math.max(cw/vw,ch/vh), ox=(cw-vw*s)/2, oy=(ch-vh*s)/2;
  return {x:(r.x-ox)/s,y:(r.y-oy)/s,w:r.w/s,h:r.h/s};
}
function rectOf(el){ const c=cam.getBoundingClientRect(),b=el.getBoundingClientRect(); return {x:b.left-c.left,y:b.top-c.top,w:b.width,h:b.height}; }

/* ---------- imagem da faixa do nome ---------- */
const oc=document.createElement('canvas'), ox=oc.getContext('2d');
function grabName(){
  const r=rectOf(strip), pad=r.h*.08; r.x+=pad; r.w-=pad*2;
  const v=toVideo(r); const TH=110, sc=Math.min(1.6,TH/v.h);
  oc.width=Math.round(v.w*sc); oc.height=Math.round(v.h*sc);
  ox.drawImage(video,v.x,v.y,v.w,v.h,0,0,oc.width,oc.height);
  return oc.toDataURL('image/jpeg',.85);
}

/* ---------- detecção de troca de carta ---------- */
const mc=document.createElement('canvas'); mc.width=32; mc.height=44; const mx=mc.getContext('2d',{willReadFrequently:true});
function motion(){
  const v=toVideo(rectOf(frame)); mx.drawImage(video,v.x,v.y,v.w,v.h,0,0,32,44);
  const d=mx.getImageData(0,0,32,44).data, cur=new Uint8Array(32*44);
  for(let i=0;i<cur.length;i++) cur[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  let diff=0; if(motionPrev) for(let i=0;i<cur.length;i++) diff+=Math.abs(cur[i]-motionPrev[i]);
  motionPrev=cur; return motionPrev?diff/cur.length:0;
}

/* ---------- leitura (Google ML Kit, nativo) ---------- */
const READER = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextReader;
async function ocrOnce(){
  const res=await READER.recognize({image:grabName()});
  const lines=(res.lines||[]).filter(l=>l.text && l.text.trim());
  if(!lines.length) return {text:'',ok:false};
  // o nome é a linha mais alta (maior fonte) da faixa
  const top=lines.reduce((m,l)=>(l.h||0)>(m.h||0)?l:m,lines[0]);
  const t=clean(top.text); const letters=(t.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
  const ok = t.length>=3 && letters/Math.max(1,t.replace(/ /g,'').length)>.8;
  return {text:t, ok};
}
async function loop(g=gen){
  if(!running||g!==gen) return;
  if(paused||mode!=='cont'||busy){ setTimeout(()=>loop(g),150); return; }
  if(motion()>10) { armed=true; prevKey=''; }
  busy=true;
  try{
    const r=await ocrOnce(); const k=norm(r.text);
    $('readTxt').textContent = r.ok ? r.text : 'Procurando o nome…';
    if(r.ok){
      const stable = prevKey && sim(prevKey,k)>=.85;
      const differs = sim(lastKey,k)<.8;
      if(stable && (armed || differs) && Date.now()-lastAddAt>500){
        add(r.text); lastKey=k; armed=false; lastAddAt=Date.now();
      }
      prevKey=k;
    } else { prevKey=''; if(r.text.length===0) armed=true; }
  }catch(e){ console.warn(e); }
  busy=false; setTimeout(()=>loop(g),40);
}
async function tapRead(){
  if(!running||busy) return; busy=true; $('readTxt').textContent='Lendo…';
  try{ let r=await ocrOnce(); if(!r.ok) r=await ocrOnce();
    if(r.ok){ add(r.text); lastKey=norm(r.text); $('readTxt').textContent=r.text; }
    else { $('readTxt').textContent='Não li o nome. Ajuste e toque de novo.'; toast('Nome não encontrado'); }
  }catch(e){ console.warn(e); }
  busy=false;
}
cam.addEventListener('click',()=>{ if(!camAlive()&&!opening){ start(); return; } if(mode==='tap') tapRead(); });

/* ---------- câmera ---------- */
let opening=null;
const camAlive=()=>stream && track && track.readyState==='live';
function setStatus(t){ $('readTxt').textContent=t; }
async function start(){
  if(camAlive()){ resume(); return; }
  if(opening) return opening;
  opening=(async()=>{
    try{
      if(!READER) throw Object.assign(new Error('leitor de texto indisponível neste aparelho'),{name:'NoReader'});
      setStatus('Abrindo a câmera…');
      const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
      try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      stream=s; track=s.getVideoTracks()[0]; video.srcObject=s;
      try{ await video.play(); }catch(e){}
      try{ const cap=track.getCapabilities?.()||{};
        if(cap.focusMode?.includes('continuous')) track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
        $('torchBtn').hidden=!cap.torch; if(torch&&cap.torch) track.applyConstraints({advanced:[{torch:true}]}).catch(()=>{}); }catch(e){}
      resume();
    }catch(e){
      console.warn(e); running=false; $('dot').classList.remove('on');
      setStatus(e.name==='NotAllowedError' ? 'Permita a câmera: toque aqui' : 'Câmera indisponível: '+(e.message||e.name)+'. Toque aqui');
    }finally{ opening=null; }
  })();
  return opening;
}
function resume(){
  running=true; motionPrev=null; layout();
  $('dot').classList.toggle('on',!paused);
  setStatus(paused?'Pausado':(mode==='tap'?'Toque na imagem para ler':'Procurando o nome…'));
  try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch(e){}
  gen++; loop(gen);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ running=false; return; }   // pausa a leitura, mantém a câmera
  start();
});
video.addEventListener('loadedmetadata',layout);

/* ---------- controles ---------- */
function setMode(m){ mode=m; $('mCont').setAttribute('aria-pressed',m==='cont'); $('mTap').setAttribute('aria-pressed',m==='tap');
  $('hint').textContent = m==='cont' ? 'Contínuo: troque a carta e ele lê sozinho. Para cartas iguais seguidas, basta trocar uma pela outra.'
                                      : 'Toque: encaixe a carta e toque na imagem para ler.';
  if(m==='tap' && running) $('readTxt').textContent='Toque na imagem para ler'; }
$('mCont').onclick=()=>setMode('cont'); $('mTap').onclick=()=>setMode('tap');
$('pauseBtn').onclick=()=>{ paused=!paused; $('pauseBtn').textContent=paused?'Continuar':'Pausar'; $('pauseBtn').classList.toggle('on',paused);
  $('dot').classList.toggle('on',!paused&&running); if(paused) $('readTxt').textContent='Pausado'; };
$('torchBtn').onclick=async()=>{ torch=!torch; try{ await track.applyConstraints({advanced:[{torch}]}); $('torchBtn').classList.toggle('on',torch);}catch(e){ torch=!torch; } };
$('plusBtn').onclick=()=>{ const i=history.length?history[history.length-1]:entries.length-1; if(i<0||!entries[i]) return; entries[i].count++; history.push(i); save(); render(i); feedback(); };
$('undoBtn').onclick=()=>{ const i=history.pop(); if(i==null||!entries[i]){ toast('Nada para desfazer'); return; }
  entries[i].count--; if(entries[i].count<=0){ entries.splice(i,1); history=history.filter(h=>h!==i).map(h=>h>i?h-1:h); } save(); render(); toast('Desfeito'); };

/* ---------- exportar ---------- */
const P = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ? window.Capacitor.Plugins : null;
const fileName=()=>{ const d=new Date(),z=n=>String(n).padStart(2,'0'); return `cartas-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.txt`; };
$('copyBtn').onclick=async()=>{ const t=listText(); if(!t){ toast('A lista está vazia'); return; }
  try{ if(P&&P.Clipboard) await P.Clipboard.write({string:t}); else await navigator.clipboard.writeText(t); toast('Lista copiada'); }
  catch(e){ const c=$('clip'); c.value=t; c.select(); try{ document.execCommand('copy'); toast('Lista copiada'); }catch(_){ toast('Não deu para copiar'); } } };
$('txtBtn').onclick=async()=>{ const t=listText(); if(!t){ toast('A lista está vazia'); return; } const nm=fileName();
  if(P&&P.Filesystem){
    try{ await P.Filesystem.writeFile({path:nm,data:t,directory:'DOCUMENTS',encoding:'utf8'}); toast('Salvo em Documentos/'+nm); }
    catch(e){ try{ const r=await P.Filesystem.writeFile({path:nm,data:t,directory:'CACHE',encoding:'utf8'}); await P.Share.share({title:nm,files:[r.uri]}); }catch(_){ toast('Não deu para salvar'); } }
    return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'})); a.download=nm; document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast('Arquivo salvo'); };
if(P&&P.Share || navigator.share){ $('shareBtn').hidden=false;
  $('shareBtn').onclick=async()=>{ const t=listText(); if(!t){ toast('A lista está vazia'); return; }
    try{ if(P&&P.Share){ const r=await P.Filesystem.writeFile({path:fileName(),data:t,directory:'CACHE',encoding:'utf8'}); await P.Share.share({title:'Lista de cartas',text:t,files:[r.uri]}); }
         else await navigator.share({title:'Lista de cartas',text:t}); }catch(e){} }; }
$('clearBtn').onclick=()=>{ $('confirmBox').hidden=false; };
$('confirmBox').onclick=e=>{ if(e.target.id==='confirmBox') $('confirmBox').hidden=true; };
$('noClear').onclick=()=>{ $('confirmBox').hidden=true; };
$('yesClear').onclick=()=>{ entries=[]; history=[]; lastKey=''; save(); render(); $('confirmBox').hidden=true; toast('Lista apagada'); };

layout(); render(); start();
})();
</script>
</body>
</html>
